<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>이름 삼행시</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
/* Layout: one narrow column — name field on top, poem below with each initial syllable set large in a stamp-like tile */
:root {
  --bg: #f6f4fb;
  --surface: #ffffff;
  --fg: #23202e;
  --muted: #6b6680;
  --line: #dcd7ea;
  --accent: #5b3fd1;
  --accent-soft: #ebe6fb;
  --display: "Gowun Batang", "Nanum Myeongjo", "AppleMyungjo", serif;
  --body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #17151f; --surface: #211e2b; --fg: #ece9f5; --muted: #a39db8;
    --line: #353047; --accent: #a993ff; --accent-soft: #2e2747; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #17151f; --surface: #211e2b; --fg: #ece9f5; --muted: #a39db8;
  --line: #353047; --accent: #a993ff; --accent-soft: #2e2747; color-scheme: dark;
}
body {
  margin: 0;
  background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 16px; line-height: 1.6;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 48px 64px;
}
main { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 28px; }
header { display: flex; flex-direction: column; gap: 6px; }
h1 { font-family: var(--display); font-weight: 700; font-size: clamp(2rem, 7vw, 2.6rem); line-height: 1.2; margin: 0; text-wrap: balance; }
h1 em { font-style: normal; color: var(--accent); }
.lede { margin: 0; color: var(--muted); }
form { display: flex; gap: 8px; flex-wrap: wrap; }
input {
  flex: 1 1 200px; min-width: 0; font: inherit; font-size: 1.15rem; padding: 12px 14px;
  border: 1.5px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--fg);
}
input:focus-visible { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
button {
  font: inherit; font-weight: 600; padding: 12px 20px; border-radius: 10px; cursor: pointer;
  border: 1.5px solid var(--accent); background: var(--accent); color: var(--bg);
}
button.ghost { background: transparent; color: var(--accent); padding: 8px 14px; font-size: .9rem; }
button:disabled { opacity: .5; cursor: progress; }
button:focus-visible { outline: 3px solid var(--accent-soft); outline-offset: 2px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 24px; display: flex; flex-direction: column; gap: 18px; }
.tag { font-size: .78rem; letter-spacing: .06em; color: var(--muted); }
.poem { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 14px; }
.poem li { display: flex; align-items: center; gap: 14px; }
.syl {
  flex: none; width: 52px; height: 52px; display: grid; place-items: center; border-radius: 10px;
  background: var(--accent-soft); color: var(--accent); font-family: var(--display); font-weight: 700; font-size: 1.6rem;
}
.text { min-width: 0; font-family: var(--display); font-size: 1.15rem; line-height: 1.5; }
.text b { color: var(--accent); }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }
.note { margin: 0; font-size: .9rem; color: var(--muted); }
.error { color: #c0392b; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .error { color: #ff8a7a; } }
:root[data-theme="dark"] .error { color: #ff8a7a; }
@media (prefers-reduced-motion: no-preference) {
  .poem li { animation: rise .4s ease both; }
  .poem li:nth-child(2) { animation-delay: .12s; }
  .poem li:nth-child(3) { animation-delay: .24s; }
  @keyframes rise { from { transform: translateY(6px); opacity: .3; } to { transform: none; opacity: 1; } }
}
</style>
</head>
<body>
<main>
  <header>
    <h1>이름으로 짓는 <em>삼행시</em></h1>
    <p class="lede">이름 세 글자를 넣으면 한 글자씩 시작하는 삼행시를 지어 드려요.</p>
  </header>

  <form id="f">
    <input id="name" name="name" maxlength="6" placeholder="예: 김하늘" autocomplete="off" aria-label="이름">
    <button id="go" type="submit">삼행시 짓기</button>
  </form>

  <section class="card" aria-live="polite">
    <span class="tag" id="tag">예시 · 김하늘</span>
    <ol class="poem" id="poem"></ol>
    <div class="actions">
      <button class="ghost" id="again" type="button">다른 버전</button>
      <button class="ghost" id="copy" type="button">복사하기</button>
    </div>
    <p class="note" id="note"></p>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id);
const example = { name: "김하늘", lines: [
  "김이 모락모락 나는 아침밥처럼",
  "하루를 따뜻하게 시작하게 해 주는 너는",
  "늘 내 곁의 작은 햇살이야"
]};
let current = example;
let controller = null;

function render(name, lines) {
  const poem = $("poem");
  poem.textContent = "";
  [...name].forEach((ch, i) => {
    const li = document.createElement("li");
    const s = document.createElement("span"); s.className = "syl"; s.textContent = ch;
    const t = document.createElement("span"); t.className = "text";
    const line = lines[i] || "";
    if (line.startsWith(ch)) {
      const b = document.createElement("b"); b.textContent = ch;
      t.append(b, line.slice(ch.length));
    } else t.textContent = line;
    li.append(s, t);
    poem.append(li);
  });
}

function setNote(msg, isError) {
  $("note").textContent = msg;
  $("note").classList.toggle("error", !!isError);
}

async function make(name, variation) {
  name = name.replace(/\s/g, "");
  if (!name) { setNote("이름을 입력해 주세요.", true); $("name").focus(); return; }
  if (!/^[가-힣]+$/.test(name)) { setNote("한글 이름만 넣어 주세요. 예: 김하늘", true); return; }

  controller?.abort();
  controller = new AbortController();
  $("go").disabled = $("again").disabled = true;
  $("tag").textContent = name + " · 짓는 중…";
  setNote("");

  try {
    const r = await fetch("/api/poem", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name, variation }),
      signal: controller.signal,
    });
    const data = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(data.error || "삼행시를 받지 못했어요. 다시 눌러 주세요.");
    current = { name: data.name, lines: data.lines };
    render(current.name, current.lines);
    const n = [...current.name].length;
    $("tag").textContent = current.name + " " + (n === 3 ? "삼" : n) + "행시";
  } catch (e) {
    if (e.name === "AbortError") return;
    $("tag").textContent = current === example ? "예시 · 김하늘" : current.name;
    setNote(e.message || "삼행시를 받지 못했어요. 다시 눌러 주세요.", true);
  } finally {
    $("go").disabled = $("again").disabled = false;
  }
}

$("f").addEventListener("submit", (e) => { e.preventDefault(); make($("name").value, false); });
$("again").addEventListener("click", () => make($("name").value.trim() || current.name, true));
$("copy").addEventListener("click", async () => {
  const text = current.lines.join("\n");
  try { await navigator.clipboard.writeText(text); setNote("복사했어요."); }
  catch {
    const r = document.createRange(); r.selectNodeContents($("poem"));
    const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r);
    setNote("선택해 두었어요. Ctrl+C(⌘C)로 복사하세요.");
  }
});

render(example.name, example.lines);
</script>
</body>
</html>
